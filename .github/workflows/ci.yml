
name: Python CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run automated tests
        run: python -m unittest discover -v

      - name: Build Docker image
        run: docker build -t first-ci-demo:latest .

      - name: Test Docker image
        run: docker run --rm first-ci-demo:latest

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag image for Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag first-ci-demo:latest ${{ secrets.DOCKERHUB_USERNAME }}/first-ci-demo:latest
          docker tag first-ci-demo:latest ${{ secrets.DOCKERHUB_USERNAME }}/first-ci-demo:${{ github.sha }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/first-ci-demo:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/first-ci-demo:${{ github.sha }}

      - name: Prepare release package
        run: |
          mkdir -p release
          cp result_logic.py release/
          cp test_result_logic.py release/
          cp README.md release/
          cp Dockerfile release/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: first-ci-demo-release
          path: release/
          retention-days: 7
